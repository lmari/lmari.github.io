<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Luca Mari - Chatting with an AI..." />
<meta name="keywords" content="Luca Mari, chatting with an AI..., personal web site">

<link rel="stylesheet" href="../mystyles.css">
<link rel="stylesheet" href="nav.css">
<title>Luca Mari - Chatting with an AI...</title>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const sectionIds = ['intro', 'articoli', 'media', 'slide', 'dialoghi', 'storie', 'attivita'];
  const sections = Array.from(document.querySelectorAll('.content0'));
  const navLinks = Array.from(document.querySelectorAll('.nav a[href^="#"]'));

  function syncSection() {
    let sectionId = window.location.hash.replace(/^#/, '');
    if (!sectionIds.includes(sectionId)) sectionId = 'intro';

    sections.forEach(section => {
      section.classList.toggle('active', section.id === sectionId);
    });

    navLinks.forEach(link => {
      const current = link.getAttribute('href') === `#${sectionId}`;
      link.classList.toggle('current', current);
      if (current) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  window.addEventListener('hashchange', syncSection);
  syncSection();
});
</script>
</head>
