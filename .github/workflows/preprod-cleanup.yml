name: One-shot preproduction cleanup

on:
  push:
    branches:
      - redesign-2026

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structural cleanup and audit
        run: python tools/preprod_cleanup.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit cleaned site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Complete pre-production site cleanup"
          git push origin HEAD:redesign-2026
